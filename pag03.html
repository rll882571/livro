<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXERCISE</title>
    <link rel="stylesheet" href="styes/pag03.css"> 
     <script src="script/pag01.js"></script>
</head>
<body>

    <div class="folha">
        <header>
            <h1>EXERCISE</h1>
        </header>

        <main class="conteudo-licao">

            <div class="colunas-principais">
                
                <section class="coluna-bloco">
                    
                    <div class="header-coluna">  
                        <div class="verbo-com-audio">
                            <p class="verbo-principal">Unscramble the Sentences</p>
                        </div>
                        
                    </div>
                    
                    <div class="exercicio" data-answer="You drank milk.">
                    
                       <p class="embaralhada">drank/ You /milk</p>
                       <input type="text" class="resposta" placeholder="Digite a frase correta">
                        <button class="checkBtn">Verificar</button>
                    </div>

                    <div class="exercicio" data-answer="She speaks Spanish.">
                    
                       <p class="embaralhada">speaks/ She /Spanish</p>
                       <input type="text" class="resposta" placeholder="Digite a frase correta">
                       <button class="checkBtn">Verificar</button>
                    </div>

                    <div class="exercicio" data-answer="Does he drink soda with you?">
                    
                    <p class="embaralhada">Does/drink/he/soda/with/you/?</p>
                    <input type="text" class="resposta" placeholder="Digite a frase correta">
                    <button class="checkBtn">Verificar</button>
                    </div>

                    <div class="exercicio" data-answer="She spoke English and Portuguese yesterday.">
                    
                    <p class="embaralhada">yesterday/ She/English/Portuguese/and/spoke</p>
                    <input type="text" class="resposta" placeholder="Digite a frase correta">
                    <button class="checkBtn">Verificar</button>
                    </div>

                    
                    
            <h2 class="reading">READING</h2>
            
        </main>
        
        <div class="before-container">
           <a href="pag01.html" class="next-btn">last</a>
        </div>
        <div class="next-container">
           <a href="pag02.html" class="next-btn">Next</a>
          </div>
        
    </div>
</body>
</html>
